# Entorno de desarrollo local: solo PostgreSQL en Docker.
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vicalba
      POSTGRES_USER: vicalba
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vicalba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-dev-data:
