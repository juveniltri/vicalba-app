# Docker no limita los logs de los contenedores: sin esto llenan el disco de la VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  vicalba-net:
    name: vicalba-net
    driver: bridge

volumes:
  db-data:
  letsencrypt:

services:

  # ── Traefik — proxy inverso + SSL automático ─────────────────────────────────
  traefik:
    # Fixed version: an upgrade is a decision, not a side effect of a restart.
    image: traefik:v3.7.15
    container_name: traefik
    restart: unless-stopped
    logging: *logging
    # The Panel writes this file (Configuración → Proxy). It is the only static
    # source: Traefik ignores CLI flags when a config file is present.
    command:
      - "--configFile=/etc/traefik/static/traefik.yml"
    environment:
      # Cloudflare API token for DNS-01, written by the Panel (Configuración →
      # Proxy). A file, so changing it needs a restart, not a new container.
      CF_DNS_API_TOKEN_FILE: /etc/traefik/static/cf-token
    networks:
      - vicalba-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The directory, not the file: a missing file would become a directory.
      - /var/vicalba/traefik/static:/etc/traefik/static:ro
      - /var/vicalba/traefik/dynamic:/etc/traefik/dynamic
      - letsencrypt:/letsencrypt

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: vicalba-db
    restart: unless-stopped
    logging: *logging
    networks:
      - vicalba-net
    environment:
      POSTGRES_DB: vicalba
      POSTGRES_USER: vicalba
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vicalba"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Panel vicalba-app ────────────────────────────────────────────────────────
  panel:
    build: .
    container_name: vicalba-panel
    restart: unless-stopped
    logging: *logging
    networks:
      - vicalba-net
    # Emergency access when Traefik is down: ssh -L 3000:localhost:3000 <vps>
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${PANEL_DOMAIN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      TRAEFIK_STATIC_DIR: /etc/traefik/static
      ACME_EMAIL: ${ACME_EMAIL:-}
      REPOS_DIR: /var/vicalba/repos
      # Destino local de los backups (Configuración → Backups); misma ruta que en el host
      BACKUPS_LOCAL_DIR: /var/vicalba/backups
      # Ruta del fichero de certificados DENTRO del contenedor traefik (debe
      # coincidir con el `storage` que genera el panel) — el panel lo lee vía `docker
      # exec` sobre ese contenedor (leerFicheroTraefik), no como fichero propio:
      # Traefik fuerza permisos 600 en ese fichero y el panel corre como
      # usuario no-root, así que no puede leerlo aunque comparta el volumen.
      ACME_JSON_PATH: /letsencrypt/acme.json
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    volumes:
      # Acceso al daemon Docker del host para gestionar contenedores de clientes
      # y ejecutar `docker exec` en el contenedor traefik (ver ACME_JSON_PATH)
      - /var/run/docker.sock:/var/run/docker.sock
      # Config dinámica de Traefik — compartida con el contenedor traefik
      - /var/vicalba/traefik/dynamic:/etc/traefik/dynamic
      # Config estática de Traefik — la escribe el panel (Configuración → Proxy)
      - /var/vicalba/traefik/static:/etc/traefik/static
      # Repositorios clonados para los deploys
      - /var/vicalba/repos:/var/vicalba/repos
      # Destino local de los backups (opcional; monta aquí un disco aparte si puedes)
      - /var/vicalba/backups:/var/vicalba/backups
      # Métricas del host — solo lectura
      - /proc:/host/proc:ro
      - /:/hostroot:ro,rslave
    group_add:
      - "${DOCKER_GID}"
    # Liveness only: any answer from /api/health counts, including its 503.
    # Traefik stops routing to an unhealthy container, so a failing check
    # (Traefik, certificates) must not lock us out of the panel.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(() => process.exit(0), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panel.rule=Host(`${PANEL_DOMAIN}`)"
      - "traefik.http.routers.panel.entrypoints=websecure"
      - "traefik.http.routers.panel.tls.certresolver=letsencrypt"
      - "traefik.http.services.panel.loadbalancer.server.port=3000"
